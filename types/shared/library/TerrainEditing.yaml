name: TerrainEditing
type: library
description: Provides support for editing terrain heights at runtime. This API is experimental and may change in future releases. Edits only affect the process that applies them and are not synced between the server and clients. Applied edits persist across level loads and get re-applied to the new level's terrain; call RevertAll on level transitions if this is not desired.

methods:
  -
    name: ApplyHeightEdit
    description: Raises or lowers the terrain in a circular area. The full height delta is applied at the center of the area and falls off smoothly towards its edge. Overlapping edits are combined additively. Edits are not validated; an edit that does not change any terrain (for example, one outside the terrain bounds) is still stored and returns a valid identifier.
    params:
      worldX:
        type: float
        description: The X coordinate of the center of the edit, in world space.
      worldZ:
        type: float
        description: The Z coordinate of the center of the edit, in world space.
      radius:
        type: float
        description: The radius of the edited area.
      heightDelta:
        type: float
        description: The amount to raise (positive) or lower (negative) the terrain by.
    returns:
      type: int
      description: An identifier for the applied edit which can be passed to RevertEdit, or `-1` if the terrain editing system is unavailable.
  -
    name: RevertEdit
    description: Reverts a previously applied terrain edit.
    params:
      editId:
        type: int
        description: The identifier returned by ApplyHeightEdit.
    returns:
      type: bool
      description: "`true` if the edit was found and reverted, `false` otherwise."
  -
    name: RevertAll
    description: Reverts all applied terrain edits.
